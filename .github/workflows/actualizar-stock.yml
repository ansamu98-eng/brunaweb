name: Actualizar stock desde Bruna ERP

# La app Bruna ERP escribe el inventario libre en la hoja publica
# "Bruna Disponible – Stock" (Google Sheets). Este flujo la lee y
# genera stock/stock.json, que es lo que muestra la pagina.

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch:          # boton para correrlo a mano

permissions:
  contents: write

jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar stock de Google Sheets
        env:
          SHEET_ID: 1OS3tTGba0k-tb-arFQJphDkxTeqh24mNm5ZcLaLPYpo
        run: |
          curl -sSL -o stock.csv "https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Stock"
          curl -sSL -o info.csv "https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Info&range=A1:B1&headers=0" || true
          python3 - <<'PY'
          import csv, json, sys, datetime
          rows = list(csv.DictReader(open('stock.csv', encoding='utf-8')))
          def num(x):
              try: return int(float(str(x).replace(',', '').strip() or 0))
              except ValueError: return 0
          items = []
          for r in rows:
              modelo, talla, color = (r.get('Modelo') or '').strip(), (r.get('Talla') or '').strip(), (r.get('Color') or '').strip()
              if not modelo or not color: continue
              precio, antes = num(r.get('Precio')), num(r.get('Precio antes'))
              listo = (r.get('Estado') or '').strip().lower().startswith('listo')
              regular, promo = (antes, precio) if antes and antes > precio else (precio, 0)
              item = [modelo, talla, color, 'L' if listo else 'C', regular, promo]
              eta = (r.get('Llegada estimada') or '').strip().lstrip("'")
              if not listo and eta: item.append(eta)
              items.append(item)
          if not items:
              print('La hoja vino vacia o no se pudo leer; se deja el stock anterior.'); sys.exit(0)
          # Hora en que la app actualizo el stock (hoja Info, hora de Costa Rica)
          upd = None
          try:
              fila = next(csv.reader(open('info.csv', encoding='utf-8')))
              t = fila[1].strip().lstrip("'")
              datetime.datetime.strptime(t, '%Y-%m-%d %H:%M')
              upd = t.replace(' ', 'T') + ':00-06:00'
          except Exception:
              pass
          if not upd:
              upd = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          out = {'updatedAt': upd, 'fuente': 'Bruna ERP (Google Sheets)', 'i': items}
          json.dump(out, open('stock/stock.json', 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
          print('OK:', len(items), 'filas')
          PY

      - name: Guardar si cambio
        run: |
          git config user.name "Bruna robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, subprocess
          # Guardar solo si cambio el stock o la hora en que la app lo actualizo
          try:
              old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:stock/stock.json']))
          except Exception:
              old = {}
          new = json.load(open('stock/stock.json', encoding='utf-8'))
          if old.get('i') == new.get('i') and old.get('updatedAt') == new.get('updatedAt'):
              subprocess.run(['git', 'checkout', '--', 'stock/stock.json'])
          PY
          if git diff --quiet -- stock/stock.json; then echo "Sin cambios"; exit 0; fi
          git add stock/stock.json
          git commit -m "Stock automatico desde Bruna ERP"
          git push

name: Probar fuentes de fotos
on:
  push:
    paths: [".github/workflows/probar-fuentes.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in my.salomon.com sg.salomon.com salomon.com.ph salomon.com.mx salomon.cl salomon.pe salomon.com.co salomon.com.gt salomon.com.pa salomon.com.ar salomon.com.au salomon.co.nz salomon.co.in salomon.co.th salomon.com.tw salomon.com.hk salomon.co.za salomon.ae salomon.com.sa; do
            code=$(curl -s -o /tmp/p.json -w "%{http_code}" -A "Mozilla/5.0" --max-time 20 "https://$d/products.json?limit=250"); n=$(python3 -c "import json;print(len(json.load(open('/tmp/p.json'))['products']))" 2>/dev/null || echo -); x=$(python3 -c "import json;print(sum(1 for p in json.load(open('/tmp/p.json'))['products'] if 'XT-6' in p['title'].upper()))" 2>/dev/null || echo -); echo "$d $code productos=$n xt6=$x"; done
          for u in "https://www.salomon.com/en-us/search?q=xt-6" "https://www.salomon.com/es-es/search?q=xt-6" "https://www.salomon.com/en-us/shop/product/xt-6-l41086600.html"; do echo "$u $(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36' --max-time 20 "$u")"; done

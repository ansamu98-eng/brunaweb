<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruna.cr · A tu paso</title>
<meta name="description" content="Bruna.cr: sneakers originales en Costa Rica. Mirá lo disponible en tu talla, reservá o apartá.">
<link rel="icon" href="assets/cisne.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--coral:#F8503B;--off:#FAF6F0;--choco:#4A3428;--muted:#8b7a6f;--shadow:0 1px 2px rgba(74,52,40,.05),0 8px 24px rgba(74,52,40,.07)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--coral);color:#fff;font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
  .swan{position:absolute;right:-50px;bottom:-40px;width:260px;opacity:.08;pointer-events:none}
  .logo{width:220px;max-width:70vw;display:block}
  .slogan{font-size:12px;letter-spacing:.34em;font-weight:500;margin:14px 0 6px;opacity:.9}
  p.lead{max-width:330px;text-align:center;font-size:15px;opacity:.92;margin:10px 0 30px;line-height:1.5}
  .btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;position:relative}
  .btns a{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 18px;border-radius:16px;font-weight:600;font-size:15.5px;text-decoration:none}
  .btns a.main{background:#fff;color:var(--coral);box-shadow:var(--shadow)}
  .btns a.alt{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
  footer{margin-top:40px;font-size:12px;opacity:.75;text-align:center}
</style>
</head>
<body>
  <img class="swan" src="assets/cisne_blanco.png" alt="">
  <img class="logo" src="assets/logo_blanco.png" alt="bruna">
  <div class="slogan">A TU PASO</div>
  <p class="lead">Sneakers originales en Costa Rica, con reservas, apartados y envío a todo el país.</p>
  <div class="btns">
    <a class="main" href="stock/">Ver qué hay en mi talla</a>
    <a class="alt" href="https://instagram.com/thebruna.cr">Escribinos por Instagram</a>
    <a class="alt" href="terminos/">Términos de compra</a>
  </div>
  <footer>Cada entrega es un mensaje que llega.</footer>
</body>
</html>

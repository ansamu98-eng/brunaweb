<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><body style="margin:0;font:12px sans-serif;background:#eee">
<div id="g" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px"></div>
<script>
fetch('/stock/fotos_alta.json?'+Date.now()).then(r=>r.json()).then(a=>{const g=document.getElementById('g');Object.keys(a).filter(k=>k[0]!=='_').forEach(k=>{g.insertAdjacentHTML('beforeend',`<div style="background:#fff"><img src="${a[k]}${a[k].includes('?')?'&':'?'}width=300" style="width:100%;height:110px;object-fit:contain"><div style="padding:2px 4px">${k}</div></div>`)})});
</script>
